<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vinyard Burger Bar | Accounts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800;900&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body data-admin-page="accounts">
  <header class="topbar">
    <a class="wordmark" href="/admin/dashboard.html"><span class="wordmark-mark">V</span><span>Vinyard Burger Bar POS</span></a>
    <nav class="nav-actions"><span><span data-user-name></span></span><button class="link-button" type="button" data-logout>Logout</button></nav>
  </header>
  <div class="admin-shell">
    <aside class="admin-sidebar"><nav class="admin-nav" id="adminNav"></nav></aside>
    <main class="admin-main">
      <div class="page-head"><p class="eyebrow">Account management</p><h2>Registered Accounts</h2></div>
      <div class="toolbar">
        <input id="accountSearch" type="search" placeholder="Search by name or email">
        <select id="roleFilter">
          <option value="all">All Roles</option>
          <option value="customer">Customer</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <section class="panel table-panel">
        <table id="accountsTable">
          <thead><tr><th>ID</th><th>Full Name</th><th>Email</th><th>Role</th><th>Date Joined</th><th>Last Seen</th></tr></thead>
          <tbody></tbody>
        </table>
      </section>
    </main>
  </div>
  <div class="toast" id="toast"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/socket.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>

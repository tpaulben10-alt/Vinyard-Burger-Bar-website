<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vinyard Burger Bar | Orders</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800;900&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body data-admin-page="orders">
  <header class="topbar">
    <a class="wordmark" href="/admin/dashboard.html"><span class="wordmark-mark">V</span><span>Vinyard Burger Bar POS</span></a>
    <nav class="nav-actions"><span><span data-user-name></span></span><button class="link-button" type="button" data-logout>Logout</button></nav>
  </header>
  <div class="admin-shell">
    <aside class="admin-sidebar"><nav class="admin-nav" id="adminNav"></nav></aside>
    <main class="admin-main">
      <div class="page-head"><p class="eyebrow">POS management</p><h2>Orders</h2></div>
      <div class="filter-bar">
        <button class="filter is-active" type="button" data-order-filter="all">All</button>
        <button class="filter" type="button" data-order-filter="pending">Pending</button>
        <button class="filter" type="button" data-order-filter="confirmed">Confirmed</button>
        <button class="filter" type="button" data-order-filter="preparing">Preparing</button>
        <button class="filter" type="button" data-order-filter="ready">Ready</button>
        <button class="filter" type="button" data-order-filter="delivered">Delivered</button>
        <button class="filter" type="button" data-order-filter="cancelled">Cancelled</button>
      </div>
      <section class="panel table-panel">
        <table id="ordersTable">
          <thead><tr><th>Order ID</th><th>Customer</th><th>Items Ordered</th><th>Total</th><th>Time</th><th>Status</th></tr></thead>
          <tbody></tbody>
        </table>
      </section>
    </main>
  </div>
  <div class="toast" id="toast"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/socket.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
